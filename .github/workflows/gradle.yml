
name: Build COSMIC CLIENT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Extract Project ZIP
        run: |
          mkdir -p extracted
          find . -maxdepth 2 -name '*.zip' -print
          ZIP_FILE=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Gradle Project
        run: |
          BUILD_FILE=$(find extracted -name build.gradle -o -name build.gradle.kts | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file not found"
            exit 1
          fi
          echo "BUILD_DIR=$(dirname "$BUILD_FILE")" >> $GITHUB_ENV

      - name: Build COSMIC CLIENT
        run: gradle -p "$BUILD_DIR" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-CLIENT-JAR
          path: extracted/**/build/libs/*.jar
