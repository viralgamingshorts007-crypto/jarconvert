
name: Build COSMIC CLIENT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Build COSMIC CLIENT
        working-directory: COSMIC-CLIENT-GUI-SRC
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-CLIENT-JAR
          path: COSMIC-CLIENT-GUI-SRC/build/libs/*.jar
